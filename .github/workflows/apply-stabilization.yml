name: Apply stabilization candidate

on:
  push:
    branches:
      - fix/state-recovery-and-execution-policy
    paths:
      - .github/workflows/apply-stabilization.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply stabilization candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and validate candidate patch
        run: |
          base64 --decode .github/stabilization.patch.xz.b64 | xz --decompress > /tmp/stabilization.patch
          echo '7b1fbc0d620614b0671b52c239168b987a49f4a857b1b04e5a452c1b3aa73dc6  /tmp/stabilization.patch' | sha256sum --check
          git apply --check /tmp/stabilization.patch
          git apply /tmp/stabilization.patch
          git diff --check
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run official package suite
        run: ./scripts/run-tests.sh
      - name: Validate package and reproducibility
        run: |
          python3 ./scripts/check-package.py
          python3 ./scripts/build-release.py --reproducibility-check
      - name: Commit verified candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(state): recover blocked runs and resolve execution policy'
          git push origin HEAD:${GITHUB_REF_NAME}
