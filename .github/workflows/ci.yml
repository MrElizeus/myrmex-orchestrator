name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  publish-clean:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/state-recovery-and-execution-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish clean stabilization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create fix/state-recovery-and-execution-policy-clean cfba4d3615ff9929d5bb2139baa226bca8d978fe
          git cherry-pick 664b09842801cbfc5cc186279267cd269a2a1da7
          test "$(git rev-list --count cfba4d3615ff9929d5bb2139baa226bca8d978fe..HEAD)" = "1"
          git push origin HEAD:fix/state-recovery-and-execution-policy-clean
  package:
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-dev.txt
      - run: ./scripts/run-tests.sh
      - run: python3 ./scripts/check-package.py
      - run: python3 ./scripts/build-release.py --reproducibility-check
